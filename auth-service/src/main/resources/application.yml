spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5433}/${AUTH_DB_NAME:blps_auth}
    username: ${AUTH_DB_USERNAME:blps_auth_user}
    password: ${AUTH_DB_PASSWORD:blps_auth_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

server:
  port: ${AUTH_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  service-name: auth-service
  outbox:
    poll-interval-ms: 1000
