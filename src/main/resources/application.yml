spring:
  application:
    name: blps
  config:
    import: file:.env[.properties]
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  persistence:
    business:
      persistence-unit-name: business
      datasource:
        url: jdbc:postgresql://${BUSINESS_DB_HOST}:${BUSINESS_DB_PORT}/${BUSINESS_DB_NAME}
        username: ${BUSINESS_DB_USERNAME}
        password: ${BUSINESS_DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
    auth:
      persistence-unit-name: auth
      datasource:
        url: jdbc:postgresql://${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}
        username: ${AUTH_DB_USERNAME}
        password: ${AUTH_DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
