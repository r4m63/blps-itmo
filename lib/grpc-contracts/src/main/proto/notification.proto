syntax = "proto3";

package blps.itmo.grpc;

option java_multiple_files = true;
option java_package = "blps.itmo.grpc";

import "google/protobuf/timestamp.proto";

service NotificationRpcService {
  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse);
}

message ListMyNotificationsRequest {
  int64 user_id = 1;
  int32 limit = 2;
}

message NotificationRecordDto {
  int64 id = 1;
  string event_id = 2;
  string event_type = 3;
  string aggregate_id = 4;
  int64 recipient_user_id = 5;
  string channel = 6;
  string template_key = 7;
  string subject = 8;
  string message = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListMyNotificationsResponse {
  repeated NotificationRecordDto notifications = 1;
}
