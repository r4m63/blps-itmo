syntax = "proto3";

package blps.itmo.grpc;

option java_multiple_files = true;
option java_package = "blps.itmo.grpc";

import "common.proto";

service ClaimRpcService {
  rpc CreateClaim(CreateClaimRequest) returns (ClaimDto);
  rpc GetClaim(GetClaimRequest) returns (ClaimDto);
  rpc GetTimeline(GetClaimRequest) returns (ClaimTimelineResponse);
  rpc GetAttachments(GetClaimRequest) returns (ClaimAttachmentsResponse);
  rpc GetProcessStatus(GetClaimRequest) returns (ClaimProcessStatusDto);
  rpc ProvideAdditionalInfo(AdditionalInfoRequest) returns (ClaimDto);
  rpc SubmitTenantResponse(TenantResponseRequest) returns (ClaimDto);
  rpc SupportDecision(SupportDecisionRequest) returns (ClaimDto);
  rpc RepairReassess(RepairClaimRequest) returns (ClaimDto);
  rpc RepairClose(RepairClaimRequest) returns (ClaimDto);
  rpc ListMyClaims(ListMyClaimsRequest) returns (ListMyClaimsResponse);
}

message CreateClaimRequest {
  int64 actor_user_id = 1;
  int64 landlord_user_id = 2;
  int64 tenant_user_id = 3;
  string title = 4;
  string description = 5;
  string claimed_amount = 6;
  string currency = 7;
  repeated int64 attachment_ids = 8;
}

message GetClaimRequest {
  int64 claim_id = 1;
}

message AdditionalInfoRequest {
  int64 claim_id = 1;
  int64 actor_user_id = 2;
  int64 landlord_user_id = 3;
  string comment = 4;
}

message TenantResponseRequest {
  int64 claim_id = 1;
  int64 actor_user_id = 2;
  int64 tenant_user_id = 3;
  bool agree = 4;
  string comment = 5;
}

message SupportDecisionRequest {
  int64 claim_id = 1;
  int64 actor_user_id = 2;
  int64 admin_user_id = 3;
  bool apply_penalty = 4;
  string penalty_amount = 5;
  string penalty_currency = 6;
  string note = 7;
  bool simulate_failure = 8;
}

message RepairClaimRequest {
  int64 claim_id = 1;
  int64 actor_user_id = 2;
  string note = 3;
}

message ListMyClaimsRequest {
  int64 actor_user_id = 1;
}

message ListMyClaimsResponse {
  repeated ClaimDto claims = 1;
}

message ClaimTimelineResponse {
  repeated ClaimTimelineEntryDto entries = 1;
}

message ClaimAttachmentsResponse {
  repeated AttachmentRefDto attachments = 1;
}

message ClaimProcessStatusDto {
  int64 claim_id = 1;
  string status = 2;
  string correlation_id = 3;
  bool terminal = 4;
  repeated AttachmentRefDto attachments = 5;
}
