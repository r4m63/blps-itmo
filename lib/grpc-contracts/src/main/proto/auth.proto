syntax = "proto3";

package blps.itmo.grpc;

option java_multiple_files = true;
option java_package = "blps.itmo.grpc";

import "common.proto";

service AuthRpcService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ListUsers(EmptyRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (UserDto);
  rpc DeactivateUser(DeactivateUserRequest) returns (UserDto);
}

message LoginRequest {
  int64 user_id = 1;
  string email = 2;
}

message LoginResponse {
  string token = 1;
  UserDto user = 2;
}

message ListUsersResponse {
  repeated UserDto users = 1;
}

message GetUserRequest {
  int64 user_id = 1;
}

message DeactivateUserRequest {
  int64 user_id = 1;
  string reason = 2;
  string actor_role = 3;
}
