spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5433}/${AUTH_DB_NAME:blps_auth}
    username: ${AUTH_DB_USERNAME:blps_auth_user}
    password: ${AUTH_DB_PASSWORD:blps_auth_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

server:
  port: ${AUTH_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  service-name: auth-service
  penalty-threshold: 3
  grpc:
    server:
      port: ${AUTH_GRPC_PORT:19082}
  security:
    jwt-secret: ${JWT_SECRET:lab3-demo-secret}
    jwt-ttl-seconds: 86400
  outbox:
    poll-interval-ms: 1000
    max-retry-count: 10
  kafka:
    retry:
      backoff-ms: 1000
      max-attempts: 3
