services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: blps-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - blps-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: blps-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - blps-net

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: blps-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - blps-net

  postgres-auth:
    image: postgres:16-alpine
    container_name: blps-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: blps_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./sql/init_auth_service.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blps_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blps-net

  postgres-claim:
    image: postgres:16-alpine
    container_name: blps-postgres-claim
    restart: unless-stopped
    environment:
      POSTGRES_DB: blps_claim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-claim-data:/var/lib/postgresql/data
      - ./sql/init_claim_service.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blps_claim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blps-net

  postgres-penalty:
    image: postgres:16-alpine
    container_name: blps-postgres-penalty
    restart: unless-stopped
    environment:
      POSTGRES_DB: blps_penalty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-penalty-data:/var/lib/postgresql/data
      - ./sql/init_penalty_service.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blps_penalty"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blps-net

volumes:
  postgres-auth-data:
  postgres-claim-data:
  postgres-penalty-data:
  minio-data:

networks:
  blps-net:
    driver: bridge
