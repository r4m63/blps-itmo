services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.8
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.8
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  postgres-auth:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${AUTH_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
      - ./sql/init_auth_service.sql:/docker-entrypoint-initdb.d/01-init-auth.sql:ro

  postgres-claim:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${CLAIM_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${CLAIM_DB_NAME}
      POSTGRES_USER: ${CLAIM_DB_USERNAME}
      POSTGRES_PASSWORD: ${CLAIM_DB_PASSWORD}
    volumes:
      - pgdata_claim:/var/lib/postgresql/data
      - ./sql/init_claim_service.sql:/docker-entrypoint-initdb.d/01-init-claim.sql:ro

  postgres-assessment:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${ASSESSMENT_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${ASSESSMENT_DB_NAME}
      POSTGRES_USER: ${ASSESSMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD}
    volumes:
      - pgdata_assessment:/var/lib/postgresql/data
      - ./sql/init_assessment_service.sql:/docker-entrypoint-initdb.d/01-init-assessment.sql:ro

  postgres-penalty:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${PENALTY_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${PENALTY_DB_NAME}
      POSTGRES_USER: ${PENALTY_DB_USERNAME}
      POSTGRES_PASSWORD: ${PENALTY_DB_PASSWORD}
    volumes:
      - pgdata_penalty:/var/lib/postgresql/data
      - ./sql/init_penalty_service.sql:/docker-entrypoint-initdb.d/01-init-penalty.sql:ro

  postgres-notification:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - pgdata_notification:/var/lib/postgresql/data
      - ./sql/init_notification_service.sql:/docker-entrypoint-initdb.d/01-init-notification.sql:ro

  postgres-audit:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${AUDIT_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME}
      POSTGRES_USER: ${AUDIT_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
    volumes:
      - pgdata_audit:/var/lib/postgresql/data
      - ./sql/init_audit_service.sql:/docker-entrypoint-initdb.d/01-init-audit.sql:ro

volumes:
  pgdata_auth:
  pgdata_claim:
  pgdata_assessment:
  pgdata_penalty:
  pgdata_notification:
  pgdata_audit:
  miniodata:
